server {
  listen 80;
  server_name _;

  client_max_body_size 1m;

  # ── Security Headers ──────────────────────────────────────
  add_header X-Content-Type-Options    "nosniff"                        always;
  add_header X-Frame-Options           "DENY"                           always;
  add_header X-XSS-Protection          "0"                              always;
  add_header Referrer-Policy           "no-referrer"                    always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com https://img.youtube.com https://img.clerk.com; connect-src 'self' https://*.clerk.accounts.dev https://*.clerk.com; worker-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com; form-action 'self'; frame-ancestors 'none';"
    always;
  # Uncomment if served over HTTPS:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ── API Proxy ─────────────────────────────────────────────
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Allow large file downloads
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
  }

  # ── SPA ───────────────────────────────────────────────────
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;

    # Cache static assets aggressively, revalidate HTML
    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|ico|webp)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      # Re-apply security headers for static assets too
      add_header X-Content-Type-Options "nosniff" always;
    }
  }
}
