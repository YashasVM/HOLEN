server {
  listen 80;
  server_name _;

  client_max_body_size 1m;
  sendfile on;
  tcp_nopush on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # FastAPI authorizes and accounts for the request before nginx serves bytes.
  location /_downloads/ {
    internal;
    alias /downloads/;
    max_ranges 1;
  }

  # ── Security Headers ──────────────────────────────────────
  # NOTE: nginx `add_header` directives are inherited ONLY when a nested
  # block defines none of its own. Any location that sets even one
  # add_header (e.g. Cache-Control below) loses ALL parent headers, so the
  # static-asset location repeats the full set. Keep the two blocks in sync.
  add_header X-Content-Type-Options    "nosniff"                        always;
  add_header X-Frame-Options           "DENY"                           always;
  add_header X-XSS-Protection          "0"                              always;
  add_header Referrer-Policy           "no-referrer"                    always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
  # Tightened CSP: object-src 'none' blocks plugins/embeds, base-uri 'self'
  # pins <base>, upgrade-insecure-requests forces https subresources.
  # script-src/style-src keep 'unsafe-inline': required by Vite's bootstrap
  # and Clerk's runtime-injected styles. Removing it breaks auth/page boot;
  # revisit only with nonces/hashes per build.
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com https://img.youtube.com https://img.clerk.com; connect-src 'self' https://*.clerk.accounts.dev https://*.clerk.com; worker-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"
    always;
  # HSTS is sent unconditionally here: browsers MUST ignore it over plain
  # HTTP (RFC 6797), so it is a no-op on :80 and becomes effective the
  # moment this host is served over TLS (or behind an HTTPS terminator).
  # For direct TLS, add `listen 443 ssl` + certs to this block.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ── API Proxy ─────────────────────────────────────────────
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Allow large file downloads
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
  }

  # ── SPA ───────────────────────────────────────────────────
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;

    # Cache static assets aggressively, revalidate HTML
    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|ico|webp)$ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      # Inheritance trap: this block defines add_header, so it must repeat
      # every security header from the server level (kept in sync).
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-XSS-Protection "0" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com https://img.youtube.com https://img.clerk.com; connect-src 'self' https://*.clerk.accounts.dev https://*.clerk.com; worker-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
  }
}
