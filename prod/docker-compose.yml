name: holen

services:
  backend:
    build:
      context: ./backend
      cache_from:
        - type=local,src=/tmp/docker-cache/backend
    environment:
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
      CLERK_FRONTEND_API_URL: ${CLERK_FRONTEND_API_URL:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      OWNER_GITHUB_USERNAME: ${OWNER_GITHUB_USERNAME:-YashasVM}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-7200}
      MAX_ACTIVE_JOBS: ${MAX_ACTIVE_JOBS:-1}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-25}
      MAX_JOBS_PER_USER: ${MAX_JOBS_PER_USER:-5}
      DEFAULT_USAGE_LIMIT_GB: ${DEFAULT_USAGE_LIMIT_GB:-20}
      DOWNLOAD_ACCEL_REDIRECT: "true"
      CACHE_LIMIT_GB: ${CACHE_LIMIT_GB:-45}
      DOWNLOAD_LINK_TTL_SECONDS: ${DOWNLOAD_LINK_TTL_SECONDS:-3600}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-900}
      DOWNLOAD_DIR: /downloads
      SQLITE_PATH: /data/app.db
      YTDLP_COOKIES_FILE: /cookies/cookies.txt
    volumes:
      - ${DOWNLOAD_DIR:-./downloads}:/downloads
      - ./data:/data
      - ${YTDLP_COOKIES_PATH:-/dev/null}:/cookies/cookies.txt
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
      cache_from:
        - type=local,src=/tmp/docker-cache/frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # The on-demand proxy owns the public port and wakes this stack.
      - "127.0.0.1:8088:80"
    volumes:
      - ${DOWNLOAD_DIR:-./downloads}:/downloads:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles:
      - tunnel
    depends_on:
      frontend:
        condition: service_started
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
