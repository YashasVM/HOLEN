name: Android release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager --channel=3 "platforms;android-37.1" "build-tools;36.0.0"
      - name: Restore signing key
        env:
          HOLEN_KEYSTORE_BASE64: ${{ secrets.HOLEN_KEYSTORE_BASE64 }}
        run: |
          test -n "$HOLEN_KEYSTORE_BASE64"
          printf '%s' "$HOLEN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/holen-release.jks"
      - name: Build signed APKs
        working-directory: android
        env:
          HOLEN_KEYSTORE_PATH: ${{ runner.temp }}/holen-release.jks
          HOLEN_KEYSTORE_PASSWORD: ${{ secrets.HOLEN_KEYSTORE_PASSWORD }}
          HOLEN_KEY_ALIAS: ${{ secrets.HOLEN_KEY_ALIAS }}
          HOLEN_KEY_PASSWORD: ${{ secrets.HOLEN_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          ./gradlew \
            -PholenVersionName="$version" \
            -PholenVersionCode="${GITHUB_RUN_NUMBER}" \
            assembleArm64Release \
            assembleArmv7Release \
            assembleUniversalRelease
      - name: Collect artifacts and checksums
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          mkdir -p release
          cp android/app/build/outputs/apk/arm64/release/*.apk "release/holen-${version}-arm64-v8a.apk"
          cp android/app/build/outputs/apk/armv7/release/*.apk "release/holen-${version}-armeabi-v7a.apk"
          cp android/app/build/outputs/apk/universal/release/*.apk "release/holen-${version}-universal.apk"
          cd release
          sha256sum *.apk > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
