name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: Secret and credential-file protection
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0. Full history is required on protected-branch pushes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Fetch the pull-request base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      # gitleaks-action v2.3.9. PRs scan only their proposed commits; pushes scan history.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject tracked credential and binary-delivery files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=0
          while IFS= read -r path; do
            case "$path" in
              .env|*/.env|.env.local|*/.env.local|*/cookies.txt|cookies.txt|*/google-services.json|google-services.json|*/local.properties|local.properties|*.jks|*.keystore|*.pem|*.key|*.p12|*service-account*.json|*service_account*.json|*deployment*credential*.json|*.apk|*.aab)
                echo "Tracked sensitive or generated file is not allowed: $path" >&2
                forbidden=1
                ;;
            esac
          done < <(git ls-files)
          (( forbidden == 0 ))
  verify:
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m compileall -q app
        working-directory: backend
      - run: node --check bin/holen.js
