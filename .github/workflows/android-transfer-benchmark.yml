name: Android Transfer Benchmark

on:
  push:
    branches: ["agent-dev"]
    paths:
      - "prod/android/app/src/androidTest/java/com/yashasvm/holen/DirectTransferTimingTest.kt"
      - ".github/workflows/android-transfer-benchmark.yml"

jobs:
  transfer-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure deterministic direct transfer
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: prod/android
          script: |
            adb logcat -c
            ./gradlew connectedEmulatorDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yashasvm.holen.DirectTransferTimingTest -Pandroid.testInstrumentationRunnerArguments.holenTransferTiming=true
            mkdir -p app/build/reports/transfer
            adb logcat -d -s HOLENTransferTiming:I '*:S' | tee app/build/reports/transfer/direct-transfer-timing.txt
            test -s app/build/reports/transfer/direct-transfer-timing.txt
            grep -q 'transfer_bytes=' app/build/reports/transfer/direct-transfer-timing.txt
            grep -q 'transfer_fresh_ms=' app/build/reports/transfer/direct-transfer-timing.txt
            grep -q 'transfer_resume_offset_bytes=' app/build/reports/transfer/direct-transfer-timing.txt
            grep -q 'transfer_resume_ms=' app/build/reports/transfer/direct-transfer-timing.txt
            cat app/build/reports/transfer/direct-transfer-timing.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Expose transfer timing metadata
        id: transfer_timing
        working-directory: prod/android
        shell: bash
        run: |
          set -euo pipefail
          report=app/build/reports/transfer/direct-transfer-timing.txt
          timing_line=$(grep 'transfer_bytes=' "$report" | tail -n 1)
          for key in transfer_bytes transfer_fresh_ms transfer_resume_offset_bytes transfer_resume_ms; do
            value=$(printf '%s\n' "$timing_line" | sed -n "s/.*${key}=\([0-9][0-9]*\).*/\1/p")
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "Missing numeric $key in transfer timing report." >&2; exit 1; }
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
      - name: Upload transfer benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOLEN-android-transfer-${{ steps.transfer_timing.outputs.transfer_bytes }}b-fresh-${{ steps.transfer_timing.outputs.transfer_fresh_ms }}ms-resume-from-${{ steps.transfer_timing.outputs.transfer_resume_offset_bytes }}b-${{ steps.transfer_timing.outputs.transfer_resume_ms }}ms
          path: prod/android/app/build/reports/transfer/**
          if-no-files-found: warn
          retention-days: 7
