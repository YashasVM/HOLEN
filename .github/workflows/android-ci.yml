name: Android CI

on:
  push:
    branches:
      - main
      - agent-dev
  pull_request:
    paths:
      - 'prod/android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-android:
    name: Verify Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prod/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify wrapper checksum
        run: |
          echo "c75f2ef457a2628f0b28ed66c97b3c90301dcc284795939f95713a8606998912  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Run lint and unit tests
        run: ./gradlew lint test --stacktrace

      - name: Assemble debug and release APKs
        run: ./gradlew assembleEmulatorDebug assembleArm64Release assembleArmv7Release assembleUniversalRelease --stacktrace

      - name: Verify native libraries support 16 KB pages
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys
          import zipfile

          failures = []
          for apk in sorted(pathlib.Path("app/build/outputs/apk").glob("**/*.apk")):
              with zipfile.ZipFile(apk) as zf:
                  for name in zf.namelist():
                      if not name.startswith("lib/") or not name.endswith(".so"):
                          continue
                      data = zf.read(name)
                      path = pathlib.Path("/tmp") / pathlib.Path(name).name
                      path.write_bytes(data)
                      result = subprocess.run(["readelf", "-lW", path], capture_output=True, text=True, check=True)
                      for line in result.stdout.splitlines():
                          if line.lstrip().startswith("LOAD"):
                              align = int(line.split()[-1], 16)
                              if align < 0x4000:
                                  failures.append(f"{apk}: {name} LOAD align {align:#x}")
          if failures:
              print("Native libraries with <16 KB LOAD alignment:", file=sys.stderr)
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(1)
          print("All packaged native LOAD segments are 16 KB compatible.")
          PY

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: HOLEN-android-apks
          path: |
            prod/android/app/build/outputs/apk/arm64/release/*.apk
            prod/android/app/build/outputs/apk/armv7/release/*.apk
            prod/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload lint and unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOLEN-android-verification-reports
          path: |
            prod/android/app/build/reports/lint-results-*.html
            prod/android/app/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 7

  instrumentation:
    name: Android instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make Gradle executable
        working-directory: prod/android
        run: chmod +x gradlew

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          # HOLEN uses the system animator scale to select reduced-motion onboarding.
          # Keep animations enabled so the cinematic onboarding-order test exercises
          # the normal production path instead of auto-skipping the Welcome stage.
          disable-animations: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: prod/android
          script: |
            # Some emulator images retain zero animation scales even when the runner
            # does not disable them. Make the production-motion test environment
            # explicit before MainActivity is launched by instrumentation.
            adb shell settings put global window_animation_scale 1.0
            adb shell settings put global transition_animation_scale 1.0
            adb shell settings put global animator_duration_scale 1.0
            test "$(adb shell settings get global animator_duration_scale | tr -d '\r')" = "1.0"

            # android-emulator-runner executes script lines separately, so keep each
            # command self-contained instead of relying on shell line continuations.
            adb logcat -c
            ./gradlew connectedEmulatorDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yashasvm.holen.EngineStartupTimingTest -Pandroid.testInstrumentationRunnerArguments.holenStartupTiming=true
            mkdir -p app/build/reports/startup
            adb logcat -d -s HOLENStartupTiming:I '*:S' | tee app/build/reports/startup/engine-startup-timing.txt
            test -s app/build/reports/startup/engine-startup-timing.txt
            grep -q 'youtube_dl_ms=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'ffmpeg_ms=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'aria2c_ms=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'post_prewarm_tool_reentry_ms=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'process_launch_ms=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'local_extract_ms=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'local_extract_overhead_ms=' app/build/reports/startup/engine-startup-timing.txt
            cat app/build/reports/startup/engine-startup-timing.txt >> "$GITHUB_STEP_SUMMARY"

            ./gradlew connectedEmulatorDebugAndroidTest

      # Artifact metadata is readable through the GitHub API even when artifact ZIP
      # contents are not. Publish the numeric probe values in the artifact name so
      # autonomous follow-up runs can consume the evidence without guessing.
      - name: Expose startup timing metadata
        id: startup_timing
        working-directory: prod/android
        shell: bash
        run: |
          set -euo pipefail
          report=app/build/reports/startup/engine-startup-timing.txt
          test -s "$report"
          timing_line=$(grep 'youtube_dl_ms=' "$report" | tail -n 1)
          for key in youtube_dl_ms ffmpeg_ms aria2c_ms post_prewarm_tool_reentry_ms process_launch_ms local_extract_ms local_extract_overhead_ms; do
            value=$(printf '%s\n' "$timing_line" | sed -n "s/.*${key}=\([0-9][0-9]*\).*/\1/p")
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "Missing numeric $key in startup timing report." >&2; exit 1; }
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOLEN-android-instrumentation-ytdl-${{ steps.startup_timing.outputs.youtube_dl_ms }}ms-ffmpeg-${{ steps.startup_timing.outputs.ffmpeg_ms }}ms-aria2-${{ steps.startup_timing.outputs.aria2c_ms }}ms-reentry-${{ steps.startup_timing.outputs.post_prewarm_tool_reentry_ms }}ms-proc-${{ steps.startup_timing.outputs.process_launch_ms }}ms-local-${{ steps.startup_timing.outputs.local_extract_ms }}ms-overhead-${{ steps.startup_timing.outputs.local_extract_overhead_ms }}ms
          path: |
            prod/android/app/build/reports/androidTests/connected/**
            prod/android/app/build/outputs/androidTest-results/connected/**
            prod/android/app/build/reports/startup/**
          if-no-files-found: warn
          retention-days: 7
