name: Android CI

on:
  pull_request:
    paths:
      - "prod/android/**"
      - ".github/workflows/android-*.yml"
  push:
    branches: ["main", "Android-App"]
    paths:
      - "prod/android/**"
      - ".github/workflows/android-*.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager --channel=3 "platforms;android-37.1" "build-tools;36.0.0"
      - name: Lint, test, and build
        working-directory: prod/android
        run: |
          ./gradlew \
            lintEmulatorDebug \
            testEmulatorDebugUnitTest \
            assembleEmulatorDebug \
            assembleArm64Release \
            assembleArmv7Release \
            assembleUniversalRelease
      - name: Upload ARM64 test APK
        uses: actions/upload-artifact@v4
        with:
          name: HOLEN-android-arm64-test
          path: prod/android/app/build/outputs/apk/arm64/release/*.apk
          if-no-files-found: error
          retention-days: 7
