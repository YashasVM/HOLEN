name: Android CI

on:
  pull_request:
    paths:
      - "prod/android/**"
      - ".github/workflows/android-*.yml"
  push:
    branches: ["main", "Android-App", "agent-dev"]
    paths:
      - "prod/android/**"
      - ".github/workflows/android-*.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager --channel=3 "platforms;android-37.1" "build-tools;36.0.0"

      # Main-branch artifacts are meant to update an already-installed HOLEN release,
      # so they must use the same production certificate as tagged releases.
      - name: Restore release signing for main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          HOLEN_KEYSTORE_BASE64: ${{ secrets.HOLEN_KEYSTORE_BASE64 }}
          HOLEN_KEYSTORE_PASSWORD: ${{ secrets.HOLEN_KEYSTORE_PASSWORD }}
          HOLEN_KEY_ALIAS: ${{ secrets.HOLEN_KEY_ALIAS }}
          HOLEN_KEY_PASSWORD: ${{ secrets.HOLEN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in HOLEN_KEYSTORE_BASE64 HOLEN_KEYSTORE_PASSWORD HOLEN_KEY_ALIAS HOLEN_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Required release signing material is missing." >&2; exit 1; }
          done
          key_path="$RUNNER_TEMP/holen-release.jks"
          printf '%s' "$HOLEN_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          [[ -s "$key_path" ]] || { echo "Release keystore is empty." >&2; exit 1; }
          keytool -list -keystore "$key_path" -storepass "$HOLEN_KEYSTORE_PASSWORD" -alias "$HOLEN_KEY_ALIAS" >/dev/null

      - name: Lint, test, and build
        working-directory: prod/android
        shell: bash
        env:
          HOLEN_KEYSTORE_PATH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}/holen-release.jks', runner.temp) || '' }}
          HOLEN_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.HOLEN_KEYSTORE_PASSWORD || '' }}
          HOLEN_KEY_ALIAS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.HOLEN_KEY_ALIAS || '' }}
          HOLEN_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.HOLEN_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          signing_args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            signing_args+=("-PholenRequireReleaseSigning=true")
          fi
          ./gradlew \
            "${signing_args[@]}" \
            lintEmulatorDebug \
            testEmulatorDebugUnitTest \
            assembleEmulatorDebug \
            assembleArm64Release \
            assembleArmv7Release \
            assembleUniversalRelease

      - name: Verify 16 KB native library compatibility
        working-directory: prod/android
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          arm64=(app/build/outputs/apk/arm64/release/*.apk)
          universal=(app/build/outputs/apk/universal/release/*.apk)
          [[ ${#arm64[@]} -eq 1 && ${#universal[@]} -eq 1 ]] || {
            echo "Expected one arm64 and one universal release APK for 16 KB verification." >&2
            exit 1
          }
          bash scripts/verify-16k-native-libs.sh "${arm64[0]}" "${universal[0]}"

          corrupt_dir="$RUNNER_TEMP/holen-corrupt-native-apk"
          rm -rf "$corrupt_dir"
          mkdir -p "$corrupt_dir"
          unzip -qq "${arm64[0]}" -d "$corrupt_dir"
          printf 'not-an-elf' > "$corrupt_dir/lib/arm64-v8a/libcorrupt.so"
          corrupt_apk="$RUNNER_TEMP/holen-corrupt-native.apk"
          (
            cd "$corrupt_dir"
            zip -qr "$corrupt_apk" .
          )
          if bash scripts/verify-16k-native-libs.sh "$corrupt_apk"; then
            echo "16 KB verifier accepted an arbitrary corrupt 64-bit .so." >&2
            exit 1
          fi

      - name: Upload signed ARM64 update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: HOLEN-android-arm64-signed-update
          path: prod/android/app/build/outputs/apk/arm64/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload ARM64 test APK
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: HOLEN-android-arm64-test
          path: prod/android/app/build/outputs/apk/arm64/release/*.apk
          if-no-files-found: error
          retention-days: 7

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: prod/android
          script: |
            set -eu
            mkdir -p app/build/reports/startup
            collect_instrumentation_diagnostics() {
              status=$?
              trap - EXIT
              diagnostics=app/build/reports/startup/instrumentation-diagnostics.txt
              {
                echo "script_exit_status=$status"
                echo "=== adb devices ==="
                adb devices -l || true
                echo "=== target package ==="
                adb shell dumpsys package com.yashasvm.holen 2>/dev/null | head -n 80 || true
                echo "=== generated android-test outputs ==="
                find app/build -path '*androidTest*' -o -path '*androidTests*' 2>/dev/null | sort | tail -n 200 || true
              } > "$diagnostics" 2>&1
              adb logcat -d > app/build/reports/startup/instrumentation-logcat.txt 2>&1 || true
              exit "$status"
            }
            trap collect_instrumentation_diagnostics EXIT

            adb shell settings put global window_animation_scale 1.0
            adb shell settings put global transition_animation_scale 1.0
            adb shell settings put global animator_duration_scale 1.0
            test "$(adb shell settings get global animator_duration_scale | tr -d '\r')" = "1.0"

            ./gradlew connectedEmulatorDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yashasvm.holen.AppStartupTimingTest -Pandroid.testInstrumentationRunnerArguments.holenAppStartupTiming=true
            adb shell run-as com.yashasvm.holen cat files/app-startup-timing.txt | tr -d '\r' | tee app/build/reports/startup/app-startup-timing.txt
            test -s app/build/reports/startup/app-startup-timing.txt
            grep -q '^app_home_ms=[0-9][0-9]*$' app/build/reports/startup/app-startup-timing.txt
            cat app/build/reports/startup/app-startup-timing.txt >> "$GITHUB_STEP_SUMMARY"

            adb logcat -c
            ./gradlew connectedEmulatorDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yashasvm.holen.EngineStartupTimingTest -Pandroid.testInstrumentationRunnerArguments.holenStartupTiming=true
            adb logcat -d -s HOLENStartupTiming:I '*:S' | tee app/build/reports/startup/engine-startup-timing.txt
            test -s app/build/reports/startup/engine-startup-timing.txt
            grep -q 'youtube_dl_ms=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'ffmpeg_ms=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'aria2c_ms=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'post_prewarm_tool_reentry_ms=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'process_launch_ms=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'local_extract_ms=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'local_extract_overhead_ms=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'storage_write_bytes=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'storage_write_ms=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'storage_fsync_ms=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'transfer_bytes=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'transfer_fresh_ms=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'transfer_resume_offset_bytes=' app/build/reports/startup/engine-startup-timing.txt
            grep -q 'transfer_resume_ms=' app/build/reports/startup/engine-startup-timing.txt
            cat app/build/reports/startup/engine-startup-timing.txt >> "$GITHUB_STEP_SUMMARY"

            ./gradlew connectedEmulatorDebugAndroidTest

      - name: Expose startup timing metadata
        id: startup_timing
        working-directory: prod/android
        shell: bash
        run: |
          set -euo pipefail
          report=app/build/reports/startup/engine-startup-timing.txt
          app_report=app/build/reports/startup/app-startup-timing.txt
          test -s "$report"
          test -s "$app_report"
          timing_line=$(grep 'youtube_dl_ms=' "$report" | tail -n 1)
          app_line=$(grep '^app_home_ms=' "$app_report" | tail -n 1)
          for key in youtube_dl_ms ffmpeg_ms aria2c_ms post_prewarm_tool_reentry_ms process_launch_ms local_extract_ms local_extract_overhead_ms storage_write_ms storage_fsync_ms transfer_fresh_ms transfer_resume_ms; do
            value=$(printf '%s\n' "$timing_line" | sed -n "s/.*${key}=\([0-9][0-9]*\).*/\1/p")
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "Missing numeric $key in startup timing report." >&2; exit 1; }
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
          app_home_ms=$(printf '%s\n' "$app_line" | sed -n 's/^app_home_ms=\([0-9][0-9]*\)$/\1/p')
          [[ "$app_home_ms" =~ ^[0-9]+$ ]] || { echo "Missing numeric app_home_ms in app startup timing report." >&2; exit 1; }
          echo "app_home_ms=$app_home_ms" >> "$GITHUB_OUTPUT"

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOLEN-android-instrumentation-${{ github.run_id }}
          path: |
            prod/android/app/build/reports/androidTests/connected/**
            prod/android/app/build/outputs/androidTest-results/connected/**
            prod/android/app/build/reports/startup/**
          if-no-files-found: error
          retention-days: 7
