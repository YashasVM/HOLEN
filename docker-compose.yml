services:
  backend:
    build:
      context: ./backend
      cache_from:
        - type=local,src=/tmp/docker-cache/backend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
      APP_SECRET: ${APP_SECRET}
      CLERK_FRONTEND_API_URL: ${CLERK_FRONTEND_API_URL:-}
      # CLERK_SECRET_KEY is loaded from frontend/.env.local by env_file.
      OWNER_GITHUB_USERNAME: ${OWNER_GITHUB_USERNAME:-YashasVM}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-7200}
      MAX_ACTIVE_JOBS: ${MAX_ACTIVE_JOBS:-1}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-25}
      MAX_JOBS_PER_USER: ${MAX_JOBS_PER_USER:-5}
      DEFAULT_USAGE_LIMIT_GB: ${DEFAULT_USAGE_LIMIT_GB:-5}
      MAX_TEMP_GB: ${MAX_TEMP_GB:-20}
      FILE_TTL_SECONDS: ${FILE_TTL_SECONDS:-3600}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-900}
      DOWNLOAD_DIR: /downloads
      SQLITE_PATH: /data/app.db
      YTDLP_COOKIES_FILE: /cookies/cookies.txt
    volumes:
      - ${DOWNLOAD_DIR:-./downloads}:/downloads
      - ./data:/data
      - /mnt/BackupDrive/Media/Audio:/mnt/BackupDrive/Media/Audio
      - ${YTDLP_COOKIES_PATH:-/dev/null}:/cookies/cookies.txt
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      cache_from:
        - type=local,src=/tmp/docker-cache/frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8888:80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles:
      - tunnel
    depends_on:
      frontend:
        condition: service_started
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
